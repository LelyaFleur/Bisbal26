<mat-card class="login-card" [ngStyle.xs]="{'width.%': 80}" style ="margin-top: 5%; margin-bottom: 50%;">
    <h2 style = "text-align:center;">Entrar</h2>
    <form class="login-container" name="form" (ngSubmit)="formData.form.valid && login(formData)" #formData='ngForm' novalidate>
        <!--<span class="error" *ngIf="error" [@fallIn]='state'>{{ error }}</span>-->
        <mat-form-field>

            <input matInput type="text" placeholder="Correu electrònic" name="email" [(ngModel)]="email"  required />

        </mat-form-field>


        <mat-form-field>
            <input matInput type="password" placeholder="Contrassenya" name="password" [(ngModel)]="password"  required />
        </mat-form-field>
        <div fxLayout="row" style ="width: 100%!important;">
            <span class ="spacer"></span>
            <button mat-raised-button style = "background-color:#CD0030!important; color: white!important;margin-right:5%;" [disabled]="!formData.valid">Entrar</button>
